server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # HTTP only: both services export over OTLP/HTTP to 4318, which needs no
        # extra client dependency beyond opentelemetry-exporter-otlp.
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Short flush so a trace is queryable seconds after a request, which matters
  # when the workflow is "inject a fault, then go find its trace".
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
