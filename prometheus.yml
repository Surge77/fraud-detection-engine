global:
  scrape_interval: 15s
  # Faster than the scrape interval so an alert cannot be delayed by evaluation
  # cadence — the platform target is fault-to-alert in under 30s.
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: fraud-engine
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal resolves to the host running the Spring Boot app
      # from inside the Prometheus container (Docker Desktop on Windows/macOS).
      - targets: ["host.docker.internal:8080"]

  - job_name: ledger-engine
    metrics_path: /actuator/prometheus
    static_configs:
      # Run ledger-engine with LEDGER_PORT=8081 when both engines are up
      # (both default to 8080 otherwise).
      - targets: ["host.docker.internal:8081"]
